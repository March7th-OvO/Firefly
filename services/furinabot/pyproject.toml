[project]
name = "furinabot-server"
version = "0.1.0"
description = "FurinaBot streaming API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.135.0,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2,<3",
  "openai>=2,<3",
  "alibabacloud-green20220302>=3.2.4,<4",
]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
