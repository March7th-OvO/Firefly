name: FurinaBot CI

on:
  pull_request:
    branches:
      - master
    paths:
      - "services/furinabot/**"

  push:
    branches:
      - master
    paths:
      - "services/furinabot/**"

permissions:
  contents: read

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        working-directory: services/furinabot
        run: uv sync --frozen --group dev

      - name: Run tests
        working-directory: services/furinabot
        run: uv run pytest -q